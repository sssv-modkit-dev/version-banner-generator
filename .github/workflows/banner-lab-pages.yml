name: Banner Lab checks and Pages
on:
  pull_request:
    paths:
      [
        "web/**",
        "tests/web/**",
        "tools/build-web.mjs",
        "tools/serve-web.py",
        "package*.json",
        "playwright.config.mjs",
        ".github/workflows/banner-lab-pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banner-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@v4
